[build-system]
requires = [
    "maturin>=1.5,<2.0",
    # Add a fake dependency for unsupported platforms:
    "please-use-uvx-v1-on-this-platform; (sys_platform != 'linux' and sys_platform != 'darwin') or (platform_machine != 'x86_64' and platform_machine != 'aarch64')",
]
build-backend = "maturin"

[project]
name = "uvenv"
# requires-python = ">=3.10"
description = 'uvenv: pipx for uv (🦀)'
readme = "README.md"
license-expression = "MIT"
keywords = []
authors = [
    { name = "Robin van der Noord", email = "robinvandernoord@gmail.com" },
]

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    # "Architecture :: x86_64",
    # "Architecture :: aarch64",
    "Development Status :: 4 - Beta",
]

dynamic = ["version"]

dependencies = [
    "uv==0.12.7", # obviously
    "pip", # self-update
    "patchelf; platform_system == 'Linux'", # idk, but required
]

[project.optional-dependencies]
dev = [
    "maturin[zig]",
]

[tool.maturin]
bindings = "bin"

[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "uvenv"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "^<!\\-\\-next\\-version\\-placeholder\\-\\->$"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
break = "Breaking Change{s}"
feat = "Feature{s}"
fix = "Fix{es}"
perf = "Performance"
docs = "Documentation"

[tool.vommit.pypi]
enabled = false

[tool.vommit.commands]
clean = "rm -rf ./target"
build = "cargo check"
publish = "cargo clippy"
post_publish = "rm -rf ./target"

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"

